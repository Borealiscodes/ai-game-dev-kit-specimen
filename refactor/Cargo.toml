[package]
name = "ndh-softworld-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Borealis S. Hedling"]
description = "Zero-float, #![no_std] 80D Symplectic Quest Algebra, Lie Commutator CSR, and Holonomy Tracker for NDH-Gaming-Mathaggedon."
